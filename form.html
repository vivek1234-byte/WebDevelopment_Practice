<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Portal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
            color: #333;
        }

        h1 {
            text-align: center;
            color: white;
            margin-bottom: 10px;
            font-size: 36px;
            font-weight: 700;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
            letter-spacing: -0.5px;
        }

        form {
            background: white;
            padding: 50px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 700px;
            margin: 30px auto 0;
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .form-section {
            margin-bottom: 35px;
            padding-bottom: 35px;
            border-bottom: 1px solid #f0f0f0;
        }

        .form-section:last-of-type {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        label {
            display: block;
            margin-bottom: 10px;
            font-weight: 600;
            color: #2d3748;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: color 0.3s ease;
        }

        input[type="text"],
        input[type="email"],
        input[type="number"],
        input[type="tel"],
        input[type="date"],
        input[type="file"],
        select,
        textarea {
            width: 100%;
            padding: 14px 16px;
            margin-bottom: 15px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 14px;
            font-family: inherit;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            background: #f7fafc;
        }

        input[type="text"]:hover,
        input[type="email"]:hover,
        input[type="number"]:hover,
        input[type="tel"]:hover,
        input[type="date"]:hover,
        input[type="file"]:hover,
        select:hover,
        textarea:hover {
            border-color: #cbd5e0;
            background: #fff;
        }

        input[type="text"]:focus,
        input[type="email"]:focus,
        input[type="number"]:focus,
        input[type="tel"]:focus,
        input[type="date"]:focus,
        input[type="file"]:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #667eea;
            background: #fff;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 120px;
        }

        input[type="radio"],
        input[type="checkbox"] {
            margin-right: 8px;
            cursor: pointer;
            width: 18px;
            height: 18px;
            accent-color: #667eea;
            transition: transform 0.2s ease;
        }

        input[type="radio"]:hover,
        input[type="checkbox"]:hover {
            transform: scale(1.1);
        }

        input[type="radio"] + label,
        input[type="checkbox"] + label {
            display: inline;
            margin: 0 25px 15px 0;
            font-weight: 500;
            text-transform: none;
            letter-spacing: normal;
        }

        br {
            display: none;
        }

        button {
            padding: 16px 32px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
            margin-right: 15px;
            margin-top: 30px;
        }

        button:first-of-type {
            margin-top: 40px;
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.5);
        }

        button:active {
            transform: translateY(-1px);
        }

        button[type="reset"] {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            box-shadow: 0 4px 15px rgba(245, 87, 108, 0.3);
            margin-right: 0;
        }

        button[type="reset"]:hover {
            box-shadow: 0 8px 25px rgba(245, 87, 108, 0.5);
        }

        input[type="file"] {
            padding: 12px 16px;
            cursor: pointer;
        }

        input[type="file"]::file-selector-button {
            padding: 8px 16px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.3s ease;
            margin-right: 10px;
        }

        input[type="file"]::file-selector-button:hover {
            background: #764ba2;
        }

        select {
            appearance: none;
            padding-right: 40px;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 12px center;
            background-size: 20px;
            padding-right: 40px;
            background-color: #f7fafc;
        }

        select:focus {
            background-color: #fff;
        }

        @media (max-width: 768px) {
            form {
                padding: 30px 20px;
            }

            h1 {
                font-size: 28px;
            }

            .button-group {
                flex-direction: column;
            }

            button {
                width: 100%;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 20px 10px;
            }

            form {
                padding: 20px 15px;
                border-radius: 15px;
            }

            h1 {
                font-size: 24px;
            }

            label {
                font-size: 13px;
            }

            input,
            select,
            textarea {
                font-size: 16px;
            }
        }

        /* Smooth transitions for form interactions */
        form {
            position: relative;
        }

        input[required]:invalid,
        select[required]:invalid,
        textarea[required]:invalid {
            border-color: #f56565;
        }

        input[required]:invalid:focus {
            box-shadow: 0 0 0 4px rgba(245, 101, 101, 0.1);
        }

        input:-webkit-autofill,
        input:-webkit-autofill:hover,
        input:-webkit-autofill:focus {
            -webkit-box-shadow: 0 0 0 1000px #f7fafc inset;
            -webkit-text-fill-color: #333;
        }

        label {
            cursor: pointer;
        }

        /* Focus visible for accessibility */
        input:focus-visible,
        select:focus-visible,
        textarea:focus-visible,
        button:focus-visible {
            outline: 2px solid #667eea;
            outline-offset: 2px;
        }
    </style>
</head>
<body>
    <h1>Student registration portal</h1>

    <form action = "/register" method="post">
        <label for="full_name">Full name:</label>
        <input type="text" id="full_name" name="full_name" placeholder="enter name.." required>
        <br><br>
        <label for="email">University Email:</label>
        <input type="email" id="email" name="email" placeholder="Enter email..." required>
        <br><br>

        <label for="age">Age:</label>
        <input type="number" id="age" name="age" placeholder="Enter age..." required>
        <br><br>


        <label for ="course">Course:</label>
        <select name="course" id="course" required>
            <option value="">Select course</option>
            <option value="btech">B.Tech</option>
            <option value="mtech">M.Tech</option>
            <option value="mba">MBA</option>
            <option value="msc">M.Sc</option>
        </select>
        <br><br>


        <label for="branch">Branch:</label>
        <select name="branch" id="branch" required>
            <option value="">Select branch</option>
            <option value="cse">Computer Science</option>
            <option value="ece">Electronics</option>
            <option value="mech">Mechanical</option>
            <option value="civil">Civil</option>
        </select>
        <br><br>


        <label for="year">Year of Study:</label>
        <select name="year" id="year" required>
            <option value="">Select year</option>
            <option value="1">1st Year</option>
            <option value="2">2nd Year</option>
            <option value="3">3rd Year</option>
            <option value="4">4th Year</option>
        </select>
        <br><br>


        <label for="Internship City">Internship Preference:</label>
        <select name="internship_city" id="Internship City" required>
            <option value="">Select city</option>
            <option value="hyderabad">Hyderabad</option>
            <option value="bangalore">Bangalore</option>
            <option value="chennai">Chennai</option>
            <option value="mumbai">Mumbai</option>
        </select>
        <br><br>

        <label for = "resume">Upload Resume:</label>
        <input type="file" id="resume" name="resume" accept=".pdf,.doc,.docx" required>
        <br><br>

        <label for = "cover_letter">Upload Cover Letter:</label>
        <textarea id="cover_letter" name="cover_letter" placeholder="Enter cover letter..." required></textarea>
        <br><br>



        <label for="phone">Phone Number:</label>
        <input type="tel" id="phone" name="phone" placeholder="Enter phone number..." required>
        <br><br>



        <label for="dob">Date of Birth:</label>
        <input type="date" id="dob" name="dob" required>
        <br><br>
        <label for="gender">Gender:</label>
        <input type="radio" value="male" name = "gender" id = "male">
        <label for="male">Male</label>
        <input type="radio" value="female" name = "gender" id = "female">
        <label for="female">Female</label>
        <input type="radio" value="other" name = "gender" id = "other">
        <label for="other">Other</label>
        <br><br>
        <label for="skills">Skills:</label>
        <input type="checkbox" value="python" name = "skills" id = "python">
        <label for="python">Python</label>
        <input type="checkbox" value="java" name = "skills" id = "java">
        <label for="java">Java</label>
        <input type="checkbox" value="c++" name = "skills" id = "c++">
        <label for="c++">C++</label>

        <br><br>
        <label for="comments">Any comments:</label>
        <textarea id="comments" name="comments" placeholder="Enter any comments..."></textarea>
        <br><br>

        <button type="submit">Submit</button>
        <button type="reset">Reset</button>
        

    </form>

</body>
</html>
