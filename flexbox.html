<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>


        .box-container{
            background-color: bisque;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            gap: 30px;
            height: 600px;
        }
        .box{
            background-color: rgb(83, 83, 211);
            height: 200px;
            width: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .lower-box{
            background-color: rgb(83, 83, 211);
            height: 200px;
            width: 300px;
            display: flex;
        }



    </style>
</head>
<body>
    <main class="box-container">
        <section class="box">
            <h2>Box 1</h2>
        </section>

        <section class="box">
            <h2>Box 2</h2>
        </section>

        <section class="box">
            <h2>Box 3</h2>
        </section>

        <section class="lower-box">
            <h2>Lower Box</h2>
        </section>
    </main>
</body>
</html>
