<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>


    <style>

        *{
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }
        body{
            font-family: Arial, Helvetica, sans-serif;
        }

        nav{
            display: flex;
            justify-content: space-between;
            background-color: black;
            align-items: center;
            height:70px;
        }

        .nav-links{
            
            display: flex;
            gap: 30px;
        }

        .nav-links a{
            color: red;
        }
        .logo{
            color: white;
        }
        .login{
            color: white;
            background-color: blue;
            padding: 0%;

        }



    </style>
</head>
<body>
    <nav>

        <div class="logo">

            <h2>Ecommerce</h2>

        </div>
        <div class="login">
            <button>Login</button>
        </div>

        <div class="nav-links">
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
            <a href="#">Blogs</a>
        </div>


    </nav>
</body>
</html>
